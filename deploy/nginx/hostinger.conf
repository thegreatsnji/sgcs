# SGCS — Nginx (HTTP). Para HTTPS, ver docs/HOSTINGER_DEPLOY.md (Certbot / SSL Hostinger).

upstream sgcs_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    include /etc/nginx/snippets/sgcs-performance.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }

    location /media/ {
        alias /var/www/media/;
        expires 1d;
    }

    location /api/ {
        proxy_pass http://sgcs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/(health|live|ready)/ {
        proxy_pass http://sgcs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (ajuste se DJANGO_ADMIN_PATH ≠ admin)
    location ~ ^/(admin|sgcs-admin)/ {
        proxy_pass http://sgcs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
