# SGCS — produção (VPS Hostinger / Docker)
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: sgcs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sgcs}
      POSTGRES_USER: ${DB_USER:-sgcs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sgcs} -d ${DB_NAME:-sgcs}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgcs_internal

  redis:
    image: redis:7-alpine
    container_name: sgcs-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgcs_internal

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        REQUIREMENTS: production
    container_name: sgcs-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
      - ./backend/data/private:/app/data/private:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sgcs_internal
    expose:
      - "8000"

  celery-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        REQUIREMENTS: production
    container_name: sgcs-celery-worker
    restart: unless-stopped
    command:
      - sh
      - -c
      - celery -A config worker -l info --concurrency=$${CELERY_CONCURRENCY:-2} --prefetch-multiplier=$${CELERY_PREFETCH:-1}
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      backend:
        condition: service_started
    networks:
      - sgcs_internal

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        REQUIREMENTS: production
    container_name: sgcs-celery-beat
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
    depends_on:
      backend:
        condition: service_started
    networks:
      - sgcs_internal

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: sgcs-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ${NGINX_CONF_PATH:-./deploy/nginx/hostinger.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/sgcs-server-performance.conf:/etc/nginx/snippets/sgcs-performance.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - sgcs_internal

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  logs_data:

networks:
  sgcs_internal:
    driver: bridge
